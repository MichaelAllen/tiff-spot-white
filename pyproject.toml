[project]
name = "tiff-spot-white"
version = "0.1.0"
description = "Desktop TIFF spot-white channel generator"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0",
  "Pillow>=10",
  "PySide6>=6.7",
  "imagecodecs>=2025.0",
  "tifffile>=2025.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]
build = ["pyinstaller>=6.0"]

[project.scripts]
tiff-spot-white = "tiff_spot_white.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
