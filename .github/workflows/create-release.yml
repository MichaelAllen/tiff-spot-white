name: Create release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to create, such as v0.1.0"
        required: true
        type: string
      prerelease:
        description: "Mark this release as a prerelease"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run tests
        run: python -m pytest

      - name: Build macOS app
        if: runner.os == 'macOS'
        run: bash scripts/build_macos.sh

      - name: Package macOS app bundle
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "dist/Tiff Spot White.app" "dist/tiff-spot-white-macos.zip"

      - name: Build Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\build_windows.ps1

      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item "dist\Tiff Spot White.exe" "dist\tiff-spot-white-windows.exe"

      - name: Upload macOS release asset
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: tiff-spot-white-macos
          path: dist/tiff-spot-white-macos.zip
          if-no-files-found: error

      - name: Upload Windows release asset
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: tiff-spot-white-windows
          path: dist/tiff-spot-white-windows.exe
          if-no-files-found: error

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: build
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
      IS_PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}

    steps:
      - uses: actions/checkout@v4

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release
        run: |
          args=(
            release create "$RELEASE_TAG"
            release-assets/tiff-spot-white-macos.zip
            release-assets/tiff-spot-white-windows.exe
            --title "TIFF Spot White $RELEASE_TAG"
            --generate-notes
          )

          if [[ "$IS_PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi

          gh "${args[@]}"
