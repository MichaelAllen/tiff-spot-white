name: Build executables

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run tests
        run: python -m pytest

      - name: Build macOS executable
        if: runner.os == 'macOS'
        run: bash scripts/build_macos.sh

      - name: Package macOS app bundle
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "dist/Tiff Spot White.app" "dist/tiff-spot-white-macos.zip"

      - name: Build Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\build_windows.ps1

      - name: Upload macOS app bundle
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: tiff-spot-white-macos
          path: dist/tiff-spot-white-macos.zip

      - name: Upload Windows executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: tiff-spot-white-windows
          path: dist/Tiff Spot White/Tiff Spot White.exe
